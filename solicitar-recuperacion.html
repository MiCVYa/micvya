
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Recuperar acceso | MiCVYa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      color: #17233b;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #17233b;
      color: white;
      padding: 22px;
      font-size: 23px;
      font-weight: bold;
    }

    main {
      max-width: 450px;
      margin: 65px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 28px;
      box-shadow: 0 5px 20px rgba(23,35,59,.08);
    }

    h1 {
      font-size: 25px;
      margin-top: 0;
    }

    p {
      color: #68758a;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 20px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #cbd3e0;
      border-radius: 9px;
    }

    button {
      width: 100%;
      background: #2457e7;
      color: white;
      border: none;
      border-radius: 9px;
      padding: 14px;
      margin-top: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .mensaje {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    a {
      color: #2457e7;
    }
  </style>
</head>

<body>
  <header>MiCVYa | Seguridad</header>

  <main>
    <div class="card">
      <h1>Recuperar acceso</h1>

      <p>
        Ingresá el correo de tu cuenta administradora.
        Te enviaremos un enlace para establecer
        una contraseña nueva.
      </p>

      <form id="formulario">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <button id="enviar" type="submit">
          Enviar enlace de recuperación
        </button>
      </form>

      <p id="mensaje" class="mensaje" role="status"></p>

      <p>
        <a href="/admin">
          Volver al administrador
        </a>
      </p>
    </div>
  </main>

  <script>
    const formulario =
      document.getElementById("formulario");

    const boton =
      document.getElementById("enviar");

    const mensaje =
      document.getElementById("mensaje");

    formulario.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();

        boton.disabled = true;
        mensaje.textContent = "Enviando solicitud...";

        try {
          const email =
            document.getElementById("email")
              .value.trim();

          const respuesta = await fetch(
            "/api/solicitar-recuperacion",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ email }),
              cache: "no-store"
            }
          );

          const datos = await respuesta.json();

          if (!respuesta.ok) {
            throw new Error(
              datos.error ||
              "No se pudo solicitar la recuperación"
            );
          }

          mensaje.textContent =
            datos.mensaje ||
            "Revisá tu correo electrónico.";

        } catch (error) {
          mensaje.textContent =
            error.message || "Ocurrió un error";
        } finally {
          boton.disabled = false;
        }
      }
    );
  </script>
</body>
</html>
